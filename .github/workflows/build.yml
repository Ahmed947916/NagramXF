name: Build Ultimate Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Prepare Config
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java" ]; then
            echo "Checking BuildVars..."
          fi

      - name: Inject Ultimate Hooks
        run: |
          if [ -f "inject_ultimate_hooks.py" ]; then
            python3 inject_ultimate_hooks.py
          fi

      - name: Compile APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimateGram-APK
          path: "TMessagesProj/build/outputs/apk/**
          /*.apk"
